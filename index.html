<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Admin Page</title>
</head>

<body>
    <div class="container mt-5">
        <h3 class="mb-4">회원가입</h3>
        <form id="signupForm">
            <div class="mb-3">
                <label for="name" class="form-label">이름</label>
                <input type="text" class="form-control" id="name" name="name" required>
            </div>

            <div class="mb-3">
                <label for="userId" class="form-label">ID</label>
                <input type="text" class="form-control" id="userId" name="userId" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">PW</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>

            <div class="mb-3">
                <label for="phone" class="form-label">전화번호</label>
                <input type="text" class="form-control" id="phone" name="phone" placeholder="010-0000-0000" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">이메일</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>

            <div class="mb-3">
                <label for="address" class="form-label">주소</label>
                <input type="text" class="form-control" id="address" name="address">
            </div>

            <div class="mb-3">
                <label class="form-label">성별</label><br>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="gender" id="male" value="남성" required>
                    <label class="form-check-label" for="male">남성</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="gender" id="female" value="여성">
                    <label class="form-check-label" for="female">여성</label>
                </div>
            </div>

            <div class="mb-3">
                <label for="birth" class="form-label">생년월일</label>
                <input type="date" class="form-control" id="birth" name="birth" required>
            </div>

            <button type="submit" class="btn btn-primary">회원가입</button>
        </form>
    </div>

    <div class="container mt-3">
        <h3 class="mt-5 mb-3">신규 등록 상품</h3>
        <form class="row row-cols-lg-auto g-3 align-items-center" id="searchForm">
            <div class="col-12">
                <select class="form-select" id="inlineFormSelectPref" name="category_data_table">
                    <option value="">전체 카테고리</option>
                    <option value="상의">상의</option>
                    <option value="하의">하의</option>
                    <option value="신발">신발</option>
                    <option value="패션잡화">패션잡화</option>
                </select>
            </div>
            <div class="col-3">
                <input type="text" class="form-control" placeholder="상품명 검색" id="productSearch">
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-primary">조회</button>
            </div>
        </form>

        <div class="container mt-3">
            <table class="table table-sm">
                <thead class="table-light">
                    <tr>
                        <th>카테고리</th>
                        <th>브랜드</th>
                        <th>상품명</th>
                        <th>가격</th>
                    </tr>
                </thead>
                <tbody id="product_data_Table">
                    <!-- 제품 데이터가 여기 추가됩니다. -->
                </tbody>
            </table>
        </div>

        <!-- 페이지네이션 -->
        <nav>
            <ul class="pagination justify-content-center" id="pagination">
                <!-- 페이지 버튼이 여기에 생성됩니다 -->
            </ul>
        </nav>
    </div>

    <script>
        const product_data = [
            { category: "상의", brand: 'Supreme', product: '슈프림 박스로고 후드티', price: '390,000' },
            { category: "하의", brand: 'DIESEL', product: '디젤 트랙 팬츠', price: '188,000' },
            { category: "신발", brand: 'Nike', product: '에어포스 1', price: '137,000' },
            { category: "패션잡화", brand: 'Music&Goods', product: '빵빵이 키링', price: '29,000' },
            // 추가 데이터 가능
        ];

        const product_data_Table = document.getElementById('product_data_Table');
        const searchForm = document.getElementById('searchForm');
        const pagination = document.getElementById('pagination');

        const ITEMS_PER_PAGE = 3;
        let currentPage = 1;

        function renderTable(data) {
            product_data_Table.innerHTML = '';
            const start = (currentPage - 1) * ITEMS_PER_PAGE;
            const paginatedData = data.slice(start, start + ITEMS_PER_PAGE);

            paginatedData.forEach(item => {
                const row = product_data_Table.insertRow();
                row.insertCell(0).innerHTML = item.category;
                row.insertCell(1).innerHTML = item.brand;
                row.insertCell(2).innerHTML = item.product;
                row.insertCell(3).innerHTML = item.price;
            });
        }

        function renderPagination(data) {
            pagination.innerHTML = '';
            const totalPages = Math.ceil(data.length / ITEMS_PER_PAGE);

            for (let i = 1; i <= totalPages; i++) {
                const li = document.createElement('li');
                li.className = `page-item ${i === currentPage ? 'active' : ''}`;
                li.innerHTML = `<button class="page-link">${i}</button>`;
                li.addEventListener('click', () => {
                    currentPage = i;
                    renderTable(filteredData);
                    renderPagination(filteredData);
                });
                pagination.appendChild(li);
            }
        }

        let filteredData = product_data;

        searchForm.addEventListener('submit', function (e) {
            e.preventDefault();
            const category = document.getElementById('inlineFormSelectPref').value;
            const keyword = document.getElementById('productSearch').value.trim();

            filteredData = product_data.filter(item => {
                return (!category || item.category === category) &&
                    (!keyword || item.product.includes(keyword));
            });

            currentPage = 1;
            renderTable(filteredData);
            renderPagination(filteredData);
        });

        // 초기 렌더링
        renderTable(filteredData);
        renderPagination(filteredData);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
